<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1240" height="1210" fill="#0a0a0a"/>
  <text x="620" y="42" fill="#ffffff" font-size="25" font-weight="700" text-anchor="middle">ask bot — 12-stage pipeline &amp; tools (DEV only)</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="360" y="58" width="15" height="15" rx="3" fill="#2d6cdf"/><text x="381" y="70" fill="#cfcfcf">[D] deterministic — SQL / regex / template</text>
    <rect x="690" y="58" width="15" height="15" rx="3" fill="#8a5cd8"/><text x="711" y="70" fill="#cfcfcf">[E] embeddings</text>
    <rect x="860" y="58" width="15" height="15" rx="3" fill="#d8823c"/><text x="881" y="70" fill="#cfcfcf">[L] LLM (gpt-4o-mini)</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5f5f5f"/></marker>
  </defs>

  <!-- ================= LEFT: 12 STAGES ================= -->
  <text x="40" y="108" fill="#8a8a8a" font-size="14" font-weight="700">PIPELINE  ·  runs top-to-bottom, first exit wins</text>

  <!-- each stage: circle number + title + one-line explanation -->
  <!-- 1 -->
  <rect x="40" y="120" width="620" height="52" rx="8" fill="#141414" stroke="#333"/>
  <circle cx="66" cy="146" r="14" fill="#2d6cdf"/><text x="66" y="151" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">1</text>
  <text x="92" y="141" fill="#fff" font-size="14.5" font-weight="600">Input + Auth  [D]</text>
  <text x="92" y="161" fill="#9a9a9a" font-size="12.5">receives { question, history } + the user's JWT from the widget</text>

  <!-- 2 -->
  <rect x="40" y="178" width="620" height="52" rx="8" fill="#0f1c33" stroke="#2d6cdf"/>
  <circle cx="66" cy="204" r="14" fill="#2d6cdf"/><text x="66" y="209" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">2</text>
  <text x="92" y="199" fill="#fff" font-size="14.5" font-weight="600">Pre-guard  [D]</text>
  <text x="92" y="219" fill="#9fb6e0" font-size="12.5">blocks injection/abuse · splits compound Qs ("…and when is the final?") into 2 clauses</text>

  <!-- 3 -->
  <rect x="40" y="236" width="620" height="52" rx="8" fill="#0f1c33" stroke="#2d6cdf"/>
  <circle cx="66" cy="262" r="14" fill="#2d6cdf"/><text x="66" y="267" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">3</text>
  <text x="92" y="257" fill="#fff" font-size="14.5" font-weight="600">Rate-limit  [D]</text>
  <text x="92" y="277" fill="#9fb6e0" font-size="12.5">caps 30 questions / 60s per user to stop spam &amp; runaway cost</text>

  <!-- 4 -->
  <rect x="40" y="294" width="620" height="52" rx="8" fill="#0f1c33" stroke="#2d6cdf"/>
  <circle cx="66" cy="320" r="14" fill="#2d6cdf"/><text x="66" y="325" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">4</text>
  <text x="92" y="315" fill="#fff" font-size="14.5" font-weight="600">Load context  [D]</text>
  <text x="92" y="335" fill="#9fb6e0" font-size="12.5">pulls the 48 team names + last 2 turns (for entity match &amp; follow-ups)</text>

  <!-- 5 -->
  <rect x="40" y="352" width="620" height="52" rx="8" fill="#1c1330" stroke="#8a5cd8"/>
  <circle cx="66" cy="378" r="14" fill="#8a5cd8"/><text x="66" y="383" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">5</text>
  <text x="92" y="373" fill="#fff" font-size="14.5" font-weight="600">Embed once  [E]</text>
  <text x="92" y="393" fill="#c3aee8" font-size="12.5">turns the question into one 1536-d vector, reused by 6, cache &amp; RAG</text>

  <!-- 6 -->
  <rect x="40" y="410" width="620" height="52" rx="8" fill="#1c1330" stroke="#8a5cd8"/>
  <circle cx="66" cy="436" r="14" fill="#8a5cd8"/><text x="66" y="441" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">6</text>
  <text x="92" y="431" fill="#fff" font-size="14.5" font-weight="600">Classify intent  [E]</text>
  <text x="92" y="451" fill="#c3aee8" font-size="12.5">nearest example → intent (schedule / stats / rules / my_data …) + confidence</text>

  <!-- 7 -->
  <rect x="40" y="468" width="620" height="52" rx="8" fill="#151a30" stroke="#5566aa"/>
  <circle cx="66" cy="494" r="14" fill="#2d6cdf"/><text x="66" y="499" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">7</text>
  <text x="92" y="489" fill="#fff" font-size="14.5" font-weight="600">Extract entities  [D]</text>
  <text x="92" y="509" fill="#9fb6e0" font-size="12.5">teams (aliases+typos), dates, phase, your OWN group, group-MATEs, "last/next game" + prev turn's spec/answer</text>

  <!-- 8 -->
  <rect x="40" y="526" width="620" height="52" rx="8" fill="#1c1330" stroke="#8a5cd8"/>
  <circle cx="66" cy="552" r="14" fill="#8a5cd8"/><text x="66" y="557" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">8</text>
  <text x="92" y="547" fill="#fff" font-size="14.5" font-weight="600">Detect op / dim / agg  [D+E]</text>
  <text x="92" y="567" fill="#c3aee8" font-size="12.5">op=lookup|count|rank|compare · dim=which stat (keyword→embedding) · agg=avg/sum</text>

  <!-- 9 -->
  <rect x="40" y="584" width="620" height="52" rx="8" fill="#151a30" stroke="#5566aa"/>
  <circle cx="66" cy="610" r="14" fill="#2d6cdf"/><text x="66" y="615" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">9</text>
  <text x="92" y="605" fill="#fff" font-size="14.5" font-weight="600">Assemble QuerySpec  [D]  +  LLM-understand fallback  [L]</text>
  <text x="92" y="625" fill="#9fb6e0" font-size="12.5">too vague → ONE LLM call parses the QUESTION TEXT into a spec → still executed by SQL</text>

  <!-- 10 -->
  <rect x="40" y="642" width="620" height="58" rx="8" fill="#0f1c33" stroke="#2d6cdf" stroke-width="2"/>
  <circle cx="66" cy="671" r="14" fill="#2d6cdf"/><text x="66" y="676" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">10</text>
  <text x="92" y="664" fill="#fff" font-size="14.5" font-weight="600">Override routes  [D]  →  SQL → template</text>
  <text x="92" y="684" fill="#9fb6e0" font-size="12.5">answers by SHAPE, not intent (last/next game, odds, WC group, form, ET/pens, box-score, rank…) + guards</text>
  <text x="92" y="699" fill="#6fe0a0" font-size="11.5">most questions EXIT here — 0 LLM · guards: unknown team, non-2026 year, untracked stat, follow-up "and X?"</text>

  <!-- 11 -->
  <rect x="40" y="706" width="620" height="58" rx="8" fill="#141414" stroke="#333"/>
  <circle cx="66" cy="735" r="14" fill="#2d6cdf"/><text x="66" y="740" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">11</text>
  <text x="92" y="728" fill="#fff" font-size="14.5" font-weight="600">Registry + rules  [D / L]</text>
  <text x="92" y="748" fill="#bdbdbd" font-size="12.5">my-data exact(+games)/rank/picks/pts · mate's prediction · group members/captain · rules</text>
  <text x="92" y="763" fill="#8fbf8f" font-size="11.5">private, group-scopable; locked data answers WHY (pre-kickoff / not your group) — no LLM</text>

  <!-- 12 -->
  <rect x="40" y="770" width="620" height="60" rx="8" fill="#2a1a0e" stroke="#d8823c"/>
  <circle cx="66" cy="800" r="14" fill="#d8823c"/><text x="66" y="805" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">12</text>
  <text x="92" y="793" fill="#fff" font-size="14.5" font-weight="600">Fuzzy stats RAG + crew  [L]  /  off-topic</text>
  <text x="92" y="813" fill="#e8c3a0" font-size="12.5">retrieve stat-cards → Writer⇄Judge writes a grounded answer; then log &amp; cache</text>
  <text x="92" y="827" fill="#c99a6a" font-size="11.5">the ONLY stage that composes text with the LLM</text>

  <!-- arrows -->
  <g stroke="#5f5f5f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="350" y1="172" x2="350" y2="177"/><line x1="350" y1="230" x2="350" y2="235"/>
    <line x1="350" y1="288" x2="350" y2="293"/><line x1="350" y1="346" x2="350" y2="351"/>
    <line x1="350" y1="404" x2="350" y2="409"/><line x1="350" y1="462" x2="350" y2="467"/>
    <line x1="350" y1="520" x2="350" y2="525"/><line x1="350" y1="578" x2="350" y2="583"/>
    <line x1="350" y1="636" x2="350" y2="641"/><line x1="350" y1="700" x2="350" y2="705"/>
    <line x1="350" y1="764" x2="350" y2="769"/>
  </g>
  <line x1="350" y1="830" x2="350" y2="858" stroke="#3ca55c" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="862" width="200" height="42" rx="10" fill="#0f2a17" stroke="#3ca55c" stroke-width="2"/>
  <text x="350" y="889" fill="#7fe6a0" font-size="16" text-anchor="middle" font-weight="700">ANSWER → widget</text>

  <!-- ================= RIGHT: TOOL CATALOG ================= -->
  <text x="700" y="108" fill="#8a8a8a" font-size="14" font-weight="700">TOOLS  ·  what each one answers</text>

  <!-- group A: deterministic override tools -->
  <rect x="700" y="120" width="500" height="292" rx="9" fill="#0d1626" stroke="#25406b"/>
  <text x="716" y="144" fill="#9fd0ff" font-size="13.5" font-weight="700">STAGE 10 · deterministic override tools [D]  (SQL → template, 0 LLM)</text>
  <g font-size="12.5">
    <text x="716" y="170" fill="#eaeaea" font-weight="600">gameStats</text><text x="860" y="170" fill="#9a9a9a">per-match box score: poss, shots, corners, cards, xG</text>
    <text x="716" y="194" fill="#eaeaea" font-weight="600">gameDetail / etPensList</text><text x="860" y="194" fill="#9a9a9a">ET / pens for one game · which games went to ET/pens</text>
    <text x="716" y="218" fill="#eaeaea" font-weight="600">teamStat</text><text x="860" y="218" fill="#9a9a9a">one team's totals — games played, goals for/against</text>
    <text x="716" y="242" fill="#eaeaea" font-weight="600">playerStat</text><text x="860" y="242" fill="#9a9a9a">one player's goals / assists / cards</text>
    <text x="716" y="266" fill="#eaeaea" font-weight="600">avgGoalsPerGame</text><text x="860" y="266" fill="#9a9a9a">tournament-wide average goals</text>
    <text x="716" y="290" fill="#eaeaea" font-weight="600">tournamentProgress</text><text x="860" y="290" fill="#9a9a9a">games played / remaining / total goals</text>
    <text x="716" y="314" fill="#eaeaea" font-weight="600">statLeaderboard</text><text x="860" y="314" fill="#9a9a9a">rank leaders (top scorer, best defense…), tie-aware</text>
    <text x="716" y="338" fill="#eaeaea" font-weight="600">compareTeams / recentForm</text><text x="880" y="338" fill="#9a9a9a">two teams head-to-head · last-N form strip</text>
    <text x="716" y="362" fill="#eaeaea" font-weight="600">bracketStatus</text><text x="860" y="362" fill="#9a9a9a">is a team still in / knocked out / champion</text>
    <text x="716" y="386" fill="#eaeaea" font-weight="600">globalStandings / userPicksPublic</text><text x="960" y="386" fill="#9a9a9a">global board · a user's public picks</text>
    <text x="716" y="406" fill="#eaeaea" font-weight="600">gameOdds / championOdds / wcGroupTable</text><text x="1000" y="406" fill="#9a9a9a">odds · WC groups A–L</text>
  </g>

  <!-- group B: registry / intent tools -->
  <rect x="700" y="424" width="500" height="196" rx="9" fill="#101010" stroke="#333"/>
  <text x="716" y="448" fill="#cfcfcf" font-size="13.5" font-weight="700">STAGE 11 · intent tools [D]  ·  rules [D/L]</text>
  <g font-size="12.5">
    <text x="716" y="474" fill="#eaeaea" font-weight="600">lookupGame / scheduleList</text><text x="940" y="474" fill="#9a9a9a">next game, fixtures, a round</text>
    <text x="716" y="498" fill="#eaeaea" font-weight="600">whoScored</text><text x="940" y="498" fill="#9a9a9a">goalscorers in a match (+ET/pens)</text>
    <text x="716" y="522" fill="#7fd0a0" font-weight="600">myExact / myFocus / myRates / myBracket</text><text x="980" y="522" fill="#9a9a9a">exacts · rank/pts/picks · Exact% · bracket</text>
    <text x="716" y="546" fill="#7fd0a0" font-weight="600">groupStandings / memberPrediction / groupMeta</text><text x="1010" y="546" fill="#9a9a9a">table · a mate's pick · members</text>
    <text x="716" y="566" fill="#7fd0a0" font-weight="600">whoPicked / dayPoints / latestRoast</text><text x="980" y="566" fill="#9a9a9a">who picked X · a match-day · the roast</text>
    <text x="716" y="586" fill="#eaeaea" font-weight="600">rulesFAQ</text><text x="940" y="586" fill="#9a9a9a">scoring / locks / limits — canned [D]</text>
    <text x="716" y="606" fill="#e0b48a" font-weight="600">rules LLM (grounded)</text><text x="940" y="606" fill="#9a9a9a">other "how does the app work" [L]</text>
    <text x="716" y="612" fill="#7fbf7f" font-size="11.5">green = private, JWT→RLS, template only — never to an LLM</text>
  </g>

  <!-- group C: LLM path -->
  <rect x="700" y="632" width="500" height="150" rx="9" fill="#2a1a0e" stroke="#d8823c"/>
  <text x="716" y="656" fill="#f0c090" font-size="13.5" font-weight="700">STAGE 12 · the only LLM answer path [L]</text>
  <g font-size="12.5">
    <text x="716" y="682" fill="#eaeaea" font-weight="600">searchStats (RAG)</text><text x="940" y="682" fill="#c9a884">fetch public stat-cards by vector [E]</text>
    <text x="716" y="706" fill="#eaeaea" font-weight="600">answerCrew</text><text x="940" y="706" fill="#c9a884">1 grounded call + deterministic number-check</text>
    <text x="716" y="730" fill="#eaeaea" font-weight="600">off-topic reply</text><text x="940" y="730" fill="#c9a884">short polite steer-back [L]</text>
    <text x="716" y="756" fill="#c9a06a" font-size="11.5">LLM only ever sees: the question + static rules + PUBLIC stats.</text>
    <text x="716" y="772" fill="#c9a06a" font-size="11.5">No predictions, picks or ranks ever reach it.</text>
  </g>

  <!-- security note -->
  <rect x="700" y="794" width="500" height="96" rx="9" fill="#12100a" stroke="#5a4a20"/>
  <text x="716" y="818" fill="#e0c060" font-size="13" font-weight="700">3 clients = the security boundary</text>
  <g font-size="12">
    <text x="716" y="840" fill="#cfcfcf"><tspan fill="#fff" font-weight="600">sbPublic</tspan> anon → public reads (stats, schedule, scorers)</text>
    <text x="716" y="860" fill="#cfcfcf"><tspan fill="#7fd0a0" font-weight="600">sbUser</tspan> caller JWT → RLS gates all private data</text>
    <text x="716" y="880" fill="#cfcfcf"><tspan fill="#fff" font-weight="600">sbService</tspan> service-role → ask_log / reindex writes only</text>
  </g>

  <!-- ================= CAPABILITY BAND: what it answers & who sees what ================= -->
  <text x="40" y="944" fill="#8a8a8a" font-size="14" font-weight="700">WHAT IT ANSWERS  ·  and which data each user is allowed to see</text>

  <!-- A: app & rules -->
  <rect x="40" y="956" width="378" height="150" rx="9" fill="#14120a" stroke="#5a4a20"/>
  <text x="58" y="980" fill="#e0c060" font-size="13.5" font-weight="700">A · How the app works  [static]</text>
  <g font-size="12.5" fill="#d8d0b8">
    <text x="58" y="1004">explains navigation &amp; usage: where to predict,</text>
    <text x="58" y="1022">groups, picks, the bracket, trivia, the AI roast;</text>
    <text x="58" y="1040">plus scoring, deadlines/locks and limits.</text>
  </g>
  <text x="58" y="1066" fill="#b6a86a" font-size="11.5">source: built-in RULES text (no DB, no private data)</text>
  <text x="58" y="1088" fill="#8fbf8f" font-size="11.5">visibility: SAME for every user</text>

  <!-- B: general data -->
  <rect x="431" y="956" width="378" height="150" rx="9" fill="#0d1626" stroke="#25406b"/>
  <text x="449" y="980" fill="#9fd0ff" font-size="13.5" font-weight="700">B · General tournament data  [public]</text>
  <g font-size="12.5" fill="#c6d6ea">
    <text x="449" y="1004">schedule &amp; fixtures, scores, goalscorers,</text>
    <text x="449" y="1022">team &amp; player stats, box scores, compare,</text>
    <text x="449" y="1040">bracket status, global leaderboard top.</text>
  </g>
  <text x="449" y="1066" fill="#7f9fce" font-size="11.5">source: public tables via sbPublic (anon)</text>
  <text x="449" y="1088" fill="#8fbf8f" font-size="11.5">visibility: SAME for every user (general)</text>

  <!-- C: your group data -->
  <rect x="822" y="956" width="378" height="150" rx="9" fill="#0c1a12" stroke="#2f6a44"/>
  <text x="840" y="980" fill="#7fe6a0" font-size="13.5" font-weight="700">C · Your &amp; your groups' data  [private]</text>
  <g font-size="12.5" fill="#bfe6cc">
    <text x="840" y="1004">your rank, picks, points, exact scores (+which</text>
    <text x="840" y="1022">games); group standings — all scopable to a</text>
    <text x="840" y="1040">group you name; members' picks after kickoff.</text>
  </g>
  <text x="840" y="1066" fill="#79b892" font-size="11.5">source: sbUser — your JWT → RLS · refusals say WHY:</text>
  <text x="840" y="1088" fill="#f0b0b0" font-size="11.5">pre-kickoff = "hidden until kickoff" · other groups = "private to their members"</text>

  <!-- footer -->
  <text x="620" y="1140" fill="#8a8a8a" font-size="13" text-anchor="middle">Stages 1–9 always run per clause (a compound question runs the pipeline twice). 10 / 11 / 12 are exit points — first match wins.</text>
  <text x="620" y="1162" fill="#8a8a8a" font-size="13" text-anchor="middle">Routing uses intent × op × dim × entities, so a mis-labelled intent still lands on the right tool at stage 10.</text>
  <text x="620" y="1184" fill="#6f8f6f" font-size="12.5" text-anchor="middle">DEV project ftryuvfdihmhlzvbpfeu only · never PROD.</text>
</svg>
