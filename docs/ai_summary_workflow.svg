<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1080" viewBox="0 0 1300 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#9aa4b2"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#3fb950"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#f0883e"/></marker>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#d29922"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#a371f7"/></marker>
  </defs>
  <rect width="1300" height="1080" fill="#0d1117"/>
  <text x="40" y="44" fill="#e6edf3" font-size="25" font-weight="700">Nightly AI Summary — Workflow + how the checker compares facts</text>
  <text x="40" y="69" fill="#8b949e" font-size="13">Facts = code · humor = judge · the evaluator compares every claim to the JSON, splits issues into MAJOR (fix) vs SOFT (note).</text>

  <!-- ===== LEFT: main flow ===== -->
  <!-- 1 GATHER -->
  <rect x="70" y="92" width="440" height="54" rx="9" fill="#12261a" stroke="#2ea043"/>
  <text x="290" y="114" fill="#7ee787" font-size="14" font-weight="700" text-anchor="middle">1 · GATHER DATA (code — no AI)</text>
  <text x="290" y="133" fill="#8b949e" font-size="11.5" text-anchor="middle">pull scores/standings/picks · compute the exact facts</text>
  <line x1="290" y1="146" x2="290" y2="170" stroke="#9aa4b2" stroke-width="2" marker-end="url(#a)"/>

  <!-- JSON artifact -->
  <rect x="40" y="172" width="500" height="116" rx="9" fill="#0b1a2b" stroke="#1f6feb"/>
  <text x="290" y="193" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle">JSON payload (processed) — source of truth</text>
  <text x="58" y="215" fill="#c9d1d9" font-size="10.5" font-family="Consolas,monospace">{ standings, leaderboard[ gap, streak, today_pts ],</text>
  <text x="72" y="233" fill="#c9d1d9" font-size="10.5" font-family="Consolas,monospace">games[ result, dist % , group_upset, crowd_line ],</text>
  <text x="72" y="251" fill="#c9d1d9" font-size="10.5" font-family="Consolas,monospace">picks[ champion_line, scorer_line ],</text>
  <text x="72" y="269" fill="#c9d1d9" font-size="10.5" font-family="Consolas,monospace">p4{ focus_game, recap, locked } }</text>
  <line x1="290" y1="288" x2="290" y2="312" stroke="#9aa4b2" stroke-width="2" marker-end="url(#a)"/>
  <!-- json also feeds the evaluator -->
  <path d="M540,230 L700,230" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="620" y="222" fill="#79c0ff" font-size="10.5" text-anchor="middle">same JSON →</text>

  <!-- 2 WRITE -->
  <rect x="90" y="314" width="400" height="48" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="290" y="335" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">2 · WRITE — 5 AI drafts (gpt-4o-mini)</text>
  <text x="290" y="352" fill="#8b949e" font-size="11" text-anchor="middle">each gets the JSON; writes only the jokes</text>
  <line x1="290" y1="362" x2="290" y2="386" stroke="#9aa4b2" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 JUDGE -->
  <rect x="110" y="388" width="360" height="44" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="290" y="415" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">3 · JUDGE picks best draft (gpt-4o)</text>
  <line x1="290" y1="432" x2="290" y2="456" stroke="#9aa4b2" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 CHECK -->
  <rect x="110" y="458" width="360" height="54" rx="9" fill="#1b1526" stroke="#a371f7"/>
  <text x="290" y="481" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">4 · CHECK (the evaluator →)</text>
  <text x="290" y="500" fill="#8b949e" font-size="11" text-anchor="middle">compare every fact vs JSON · classify issues</text>
  <!-- chosen draft feeds evaluator -->
  <path d="M470,485 L700,485" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <text x="585" y="477" fill="#d2a8ff" font-size="10.5" text-anchor="middle">chosen draft →</text>

  <!-- split -->
  <path d="M200,512 L200,556 L200,580" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M380,512 L380,556 L380,580" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ay)"/>

  <!-- MAJOR -->
  <rect x="40" y="582" width="300" height="120" rx="9" fill="#241a12" stroke="#f0883e"/>
  <text x="56" y="604" fill="#ffa657" font-size="13" font-weight="700">MAJOR → must fix (FAIL)</text>
  <text x="56" y="624" fill="#c9d1d9" font-size="10.5">wrong champion team · wrong gap</text>
  <text x="56" y="641" fill="#c9d1d9" font-size="10.5">wrong recap game/score · fabricated %</text>
  <text x="56" y="658" fill="#c9d1d9" font-size="10.5">wrong scorer status · false "tied"</text>
  <text x="56" y="682" fill="#8b949e" font-size="10">high-confidence → BLOCKS the summary</text>
  <line x1="190" y1="702" x2="190" y2="742" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- SOFT -->
  <rect x="360" y="582" width="300" height="120" rx="9" fill="#2b2410" stroke="#d29922"/>
  <text x="376" y="604" fill="#e3b341" font-size="13" font-weight="700">SOFT → just noted (ships)</text>
  <text x="376" y="624" fill="#c9d1d9" font-size="10.5">crowd "who was right" framing (draws)</text>
  <text x="376" y="641" fill="#c9d1d9" font-size="10.5">% on the wrong outcome (loose wording)</text>
  <text x="376" y="658" fill="#c9d1d9" font-size="10.5">"no champion left" but still alive</text>
  <text x="376" y="682" fill="#8b949e" font-size="10">could false-alarm → logged, NOT blocking</text>
  <path d="M510,702 L510,845 L640,845" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="510" y="720" fill="#3fb950" font-size="10.5" text-anchor="middle">ship as-is</text>

  <!-- 5 FIX -->
  <rect x="40" y="744" width="300" height="92" rx="9" fill="#241a12" stroke="#f0883e"/>
  <text x="190" y="766" fill="#ffa657" font-size="13.5" font-weight="700" text-anchor="middle">5 · FIX (gpt-5-mini, major only)</text>
  <text x="190" y="787" fill="#c9d1d9" font-size="10.5" text-anchor="middle">a) regenerate w/ gpt-5-mini → re-check</text>
  <text x="190" y="804" fill="#c9d1d9" font-size="10.5" text-anchor="middle">b) still wrong → rewrite only the bad line</text>
  <text x="190" y="823" fill="#8b949e" font-size="10" text-anchor="middle">clean day = gpt-5-mini never runs</text>
  <path d="M340,790 L420,790 L420,858" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="405" y="782" fill="#3fb950" font-size="10.5" text-anchor="middle">fixed</text>

  <!-- 6 SAVE -->
  <rect x="470" y="832" width="360" height="50" rx="9" fill="#12261a" stroke="#2ea043"/>
  <text x="650" y="854" fill="#7ee787" font-size="14" font-weight="700" text-anchor="middle">6 · SAVE &amp; SEND the summary</text>
  <text x="650" y="872" fill="#8b949e" font-size="11" text-anchor="middle">facts correct · humor intact · soft notes logged</text>

  <!-- clean shortcut -->
  <path d="M290,512 L290,536 L860,536 L860,857 L830,857" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="862" y="528" fill="#3fb950" font-size="10.5" text-anchor="middle">no issues → ship</text>

  <!-- ===== RIGHT: EVALUATOR explainer ===== -->
  <rect x="700" y="92" width="560" height="420" rx="10" fill="#12111c" stroke="#a371f7"/>
  <text x="720" y="118" fill="#d2a8ff" font-size="15" font-weight="700">THE EVALUATOR — how it compares (code, no AI)</text>
  <text x="720" y="140" fill="#c9d1d9" font-size="11.5">Reads the chosen summary text. For each factual claim it finds,</text>
  <text x="720" y="157" fill="#c9d1d9" font-size="11.5">it looks up the true value in the JSON and compares numbers/names.</text>
  <text x="720" y="174" fill="#8b949e" font-size="11">Pure text + number matching → same verdict every run (reproducible).</text>

  <!-- table -->
  <line x1="716" y1="188" x2="1244" y2="188" stroke="#30363d"/>
  <text x="722" y="205" fill="#8b949e" font-size="11" font-weight="700">Claim in the summary</text>
  <text x="960" y="205" fill="#8b949e" font-size="11" font-weight="700">Looked up in JSON</text>
  <text x="1150" y="205" fill="#8b949e" font-size="11" font-weight="700">If mismatch</text>
  <line x1="716" y1="212" x2="1244" y2="212" stroke="#30363d"/>

  <g font-size="11" font-family="Consolas,monospace">
    <text x="722" y="232" fill="#c9d1d9">"3 pts behind Maoz"</text>
    <text x="960" y="232" fill="#79c0ff">leaderboard gap</text>
    <text x="1150" y="232" fill="#ffa657">MAJOR</text>
    <text x="722" y="256" fill="#c9d1d9">"Avi's champion Brazil"</text>
    <text x="960" y="256" fill="#79c0ff">picks[Avi].champion</text>
    <text x="1150" y="256" fill="#ffa657">MAJOR</text>
    <text x="722" y="280" fill="#c9d1d9">recap "Game: a-b (Npts)"</text>
    <text x="960" y="280" fill="#79c0ff">p4.recap (exact)</text>
    <text x="1150" y="280" fill="#ffa657">MAJOR</text>
    <text x="722" y="304" fill="#c9d1d9">"68% had Brazil"</text>
    <text x="960" y="304" fill="#79c0ff">dist_% buckets</text>
    <text x="1150" y="304" fill="#ffa657">MAJOR (fabricated)</text>
    <text x="722" y="328" fill="#c9d1d9">"top-scorer X didn't play"</text>
    <text x="960" y="328" fill="#79c0ff">picks[].scorer_line</text>
    <text x="1150" y="328" fill="#ffa657">MAJOR</text>
    <text x="722" y="356" fill="#c9d1d9">"the field saw it coming"</text>
    <text x="960" y="356" fill="#79c0ff">majority vs result</text>
    <text x="1150" y="356" fill="#e3b341">SOFT</text>
    <text x="722" y="380" fill="#c9d1d9">"no champion left"</text>
    <text x="960" y="380" fill="#79c0ff">champion still alive?</text>
    <text x="1150" y="380" fill="#e3b341">SOFT</text>
  </g>
  <line x1="716" y1="396" x2="1244" y2="396" stroke="#30363d"/>
  <text x="722" y="418" fill="#c9d1d9" font-size="11.5" font-weight="700">Scoring:</text>
  <text x="790" y="418" fill="#c9d1d9" font-size="11.5">100 − 25/major-severe − 10/major − 3/minor.  Any MAJOR → FAIL.</text>
  <text x="722" y="440" fill="#8b949e" font-size="11">Binds a "champion/scorer/gap" phrase to the right player by the name on that line,</text>
  <text x="722" y="457" fill="#8b949e" font-size="11">then checks that player's real pick/points. Names matched with aliases (USA=United States).</text>
  <text x="722" y="482" fill="#7ee787" font-size="11.5" font-weight="700">Why split MAJOR vs SOFT:</text>
  <text x="722" y="499" fill="#8b949e" font-size="11">only rock-solid, verifiable errors block &amp; cost a gpt-5-mini fix; fuzzy tone calls are noted, never block.</text>

  <!-- footer -->
  <text x="40" y="1030" fill="#8b949e" font-size="12">Steps 1–3 &amp; 6 unchanged. The evaluator (4) + fix (5, major only) are the addition; soft errors never block. LIVE on DEV · PROD after the World Cup.</text>
</svg>
